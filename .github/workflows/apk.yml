name: Fabriquer l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Construire l'application
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Préparer le fichier
        run: cp app/build/outputs/apk/release/app-release.apk PlanningCommandes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PlanningCommandes
          path: PlanningCommandes.apk

      - name: Publier sur la page « Releases »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk PlanningCommandes.apk \
            --title "Planning Commandes — version 1.${{ github.run_number }}" \
            --notes "Sur le téléphone, touchez PlanningCommandes.apk pour le télécharger, puis ouvrez-le pour l'installer." \
            --latest
