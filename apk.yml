name: Fabriquer l'APK et l'exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- application Android
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Construire l'application
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Préparer le fichier
        run: cp app/build/outputs/apk/release/app-release.apk PlanningCommandes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PlanningCommandes
          path: PlanningCommandes.apk

      - name: Publier sur la page « Releases »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk PlanningCommandes.apk \
            --title "Planning Commandes (Android) — version 1.${{ github.run_number }}" \
            --notes "Sur le téléphone, touchez PlanningCommandes.apk pour le télécharger, puis ouvrez-le pour l'installer." \
            --latest

  # ---------------------------------------------------------------- programme PC (Windows)
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les composants
        run: python -m pip install -r pc/requirements.txt pyinstaller

      - name: Fabriquer PlanningPDF.exe
        working-directory: pc
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name PlanningPDF --icon icone.ico
          --collect-all pdfplumber --collect-all pypdfium2 --collect-all pypdfium2_raw
          --collect-data pdfminer --collect-all sv_ttk
          --add-data "regles.json;."
          planning_pdf.py

      - uses: actions/upload-artifact@v4
        with:
          name: PlanningPDF
          path: pc/dist/PlanningPDF.exe

      - name: Publier sur la page « Releases »
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete exe --yes --cleanup-tag || true
          gh release create exe pc/dist/PlanningPDF.exe \
            --title "Planning PDF (Windows) — version ${{ github.run_number }}" \
            --notes "Téléchargez PlanningPDF.exe et remplacez l'ancien dans votre dossier PlanningPDF (à côté de codes.txt et du dossier commande)." \
            --latest=false
