name: Fabriquer l'APK et l'exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Dépôt PUBLIC des mises à jour (« planning-commandes-maj ») : APK, exe et fiche maj.json y sont publiés par le job
# « publier », avec le secret MAJ_TOKEN (jeton GitHub limité à ce dépôt, Contents : lecture et écriture).
# Sans ce secret, tout reste comme avant : l'appli et l'exe cherchent leurs mises à jour dans ce dépôt-ci.
env:
  NOM_DEPOT_MAJ: planning-commandes-maj

jobs:
  # ---------------------------------------------------------------- application Android
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépôt des mises à jour
        shell: bash
        env:
          MAJ_TOKEN: ${{ secrets.MAJ_TOKEN }}
        run: |
          if [ -n "$MAJ_TOKEN" ]; then DEPOT="${{ github.repository_owner }}/${NOM_DEPOT_MAJ}"; else DEPOT="${{ github.repository }}"; fi
          echo "DEPOT_MAJ=$DEPOT" >> "$GITHUB_ENV"
          echo "Les mises à jour seront cherchées dans : $DEPOT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # clé de signature : secrets du dépôt (Settings › Secrets and variables › Actions), jamais dans les fichiers
      - name: Clé de signature (secret GitHub)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 absent : ajoutez-le dans Settings › Secrets and variables › Actions (voir le wiki, Pour les développeurs)."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD absent : ajoutez-le dans Settings › Secrets and variables › Actions."
            exit 1
          fi
          CLE="$RUNNER_TEMP/planning.keystore"
          # espaces et retours à la ligne collés par erreur avec le secret : ignorés
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$CLE" 2>/dev/null; then
            echo "::error::Secret KEYSTORE_BASE64 illisible : recopiez tout le contenu de cles\\KEYSTORE_BASE64.txt (un seul bloc)."
            exit 1
          fi
          echo "Clé décodée : $(stat -c %s "$CLE") octets (attendu : 2652)."
          if ! keytool -list -keystore "$CLE" -storepass "$KEYSTORE_PASSWORD" -alias planning > /dev/null 2>&1; then
            if [ "$(stat -c %s "$CLE")" != "2652" ]; then
              echo "::error::Secret KEYSTORE_BASE64 incomplet (collé en partie) : recopiez tout le contenu de cles\\KEYSTORE_BASE64.txt."
            else
              echo "::error::Secret KEYSTORE_PASSWORD incorrect : recopiez le contenu de cles\\KEYSTORE_PASSWORD.txt."
            fi
            exit 1
          fi
          echo "KEYSTORE_FILE=$CLE" >> "$GITHUB_ENV"

      # trois versions : manuelle, « mail » (commandes récupérées dans la boîte mail) et « lecture » (planning partagé, pour un proche)
      - name: Construire l'application (3 versions)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleManuelRelease assembleMailRelease assembleLectureRelease --no-daemon --stacktrace

      - name: Préparer les fichiers
        run: |
          cp app/build/outputs/apk/manuel/release/app-manuel-release.apk PlanningCommandes.apk
          cp app/build/outputs/apk/mail/release/app-mail-release.apk PlanningCommandes-mail.apk
          cp app/build/outputs/apk/lecture/release/app-lecture-release.apk PlanningCommandes-lecture.apk
          # numéro de version lu par l'application pour proposer la mise à jour
          echo '{"version": ${{ github.run_number }}}' > version.json

      - uses: actions/upload-artifact@v4
        with:
          name: PlanningCommandes
          path: |
            PlanningCommandes.apk
            PlanningCommandes-mail.apk
            PlanningCommandes-lecture.apk

      # archive permanente de cette fabrication (rien n'est jamais effacé) : release « vX.Y.Z-N », complétée par les 2 jobs
      - name: Archiver dans « Version X.Y.Z (fabrication N) »
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message || 'fabrication lancée à la main' }}
        run: |
          VERSION="$(tr -d '\r\n' < pc/VERSION)"
          TAG="v${VERSION}-${{ github.run_number }}"
          # description : l'entrée de cette version dans CHANGELOG.md, puis le détail de la fabrication
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md || true
          printf '\n---\nFabrication %s : %s\n\nAndroid : PlanningCommandes.apk (manuelle) ou PlanningCommandes-mail.apk ; PlanningCommandes-lecture.apk pour un proche (planning partagé). Windows : PlanningPDF.exe (manuelle) ou PlanningPDF-mail.exe. La dernière version est toujours dans les releases « apk » et « exe ».\n' \
            "${{ github.run_number }}" "${MESSAGE%%$'\n'*}" >> notes.md
          gh release create "$TAG" --target "${{ github.sha }}" --latest=false \
            --title "Version ${VERSION} (fabrication ${{ github.run_number }})" \
            --notes-file notes.md 2>/dev/null || true
          for essai in 1 2 3 4 5; do
            gh release upload "$TAG" PlanningCommandes.apk PlanningCommandes-mail.apk PlanningCommandes-lecture.apk --clobber && break
            sleep 10
          done

      - name: Publier sur la page « Releases »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          VERSION="$(tr -d '\r\n' < pc/VERSION)"
          gh release create apk PlanningCommandes.apk PlanningCommandes-mail.apk version.json \
            --title "Planning Commandes (Android) — version ${VERSION} (fabrication ${{ github.run_number }})" \
            --notes "Deux versions, à choisir : PlanningCommandes.apk (manuelle : bulletins ajoutés à la main ou par « Partager ») ; PlanningCommandes-mail.apk (en plus, récupère les commandes dans la boîte mail). Sur le téléphone, touchez le fichier pour le télécharger, puis ouvrez-le pour l'installer." \
            --latest

  # ---------------------------------------------------------------- programme PC (Windows)
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépôt des mises à jour
        shell: bash
        env:
          MAJ_TOKEN: ${{ secrets.MAJ_TOKEN }}
        run: |
          if [ -n "$MAJ_TOKEN" ]; then DEPOT="${{ github.repository_owner }}/${NOM_DEPOT_MAJ}"; else DEPOT="${{ github.repository }}"; fi
          echo "DEPOT_MAJ=$DEPOT" >> "$GITHUB_ENV"
          echo "Les mises à jour seront cherchées dans : $DEPOT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les composants
        run: python -m pip install -r pc/requirements.txt pyinstaller

      # deux versions : manuelle, sans mail (PlanningPDF.exe) et « mail » (PlanningPDF-mail.exe)
      - name: Numéro de version, dépôt et version « manuelle »
        shell: bash
        run: |
          echo "{\"version\": ${{ github.run_number }}, \"depot\": \"$DEPOT_MAJ\", \"mail\": false}" > pc/version_build.json
          echo '{"version": ${{ github.run_number }}}' > version.json

      - name: Fabriquer PlanningPDF.exe (version manuelle, sans mail)
        working-directory: pc
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name PlanningPDF --icon icone.ico
          --collect-all pdfplumber --collect-all pypdfium2 --collect-all pypdfium2_raw
          --collect-data pdfminer --collect-all sv_ttk
          --add-data "regles.json;."
          --add-data "version_build.json;."
          --add-data "VERSION;."
          planning_pdf.py

      - name: Version « mail »
        shell: bash
        run: |
          echo "{\"version\": ${{ github.run_number }}, \"depot\": \"$DEPOT_MAJ\", \"mail\": true}" > pc/version_build.json

      - name: Fabriquer PlanningPDF-mail.exe (commandes récupérées dans la boîte mail)
        working-directory: pc
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name PlanningPDF-mail --icon icone.ico
          --collect-all pdfplumber --collect-all pypdfium2 --collect-all pypdfium2_raw
          --collect-data pdfminer --collect-all sv_ttk
          --add-data "regles.json;."
          --add-data "version_build.json;."
          --add-data "VERSION;."
          planning_pdf.py

      - uses: actions/upload-artifact@v4
        with:
          name: PlanningPDF
          path: |
            pc/dist/PlanningPDF.exe
            pc/dist/PlanningPDF-mail.exe

      # archive permanente de cette fabrication (rien n'est jamais effacé) : release « vX.Y.Z-N », complétée par les 2 jobs
      - name: Archiver dans « Version X.Y.Z (fabrication N) »
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message || 'fabrication lancée à la main' }}
        run: |
          VERSION="$(tr -d '\r\n' < pc/VERSION)"
          TAG="v${VERSION}-${{ github.run_number }}"
          # description : l'entrée de cette version dans CHANGELOG.md, puis le détail de la fabrication
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md || true
          printf '\n---\nFabrication %s : %s\n\nAndroid : PlanningCommandes.apk (manuelle) ou PlanningCommandes-mail.apk ; PlanningCommandes-lecture.apk pour un proche (planning partagé). Windows : PlanningPDF.exe (manuelle) ou PlanningPDF-mail.exe. La dernière version est toujours dans les releases « apk » et « exe ».\n' \
            "${{ github.run_number }}" "${MESSAGE%%$'\n'*}" >> notes.md
          gh release create "$TAG" --target "${{ github.sha }}" --latest=false \
            --title "Version ${VERSION} (fabrication ${{ github.run_number }})" \
            --notes-file notes.md 2>/dev/null || true
          for essai in 1 2 3 4 5; do
            gh release upload "$TAG" pc/dist/PlanningPDF.exe pc/dist/PlanningPDF-mail.exe --clobber && break
            sleep 10
          done

      - name: Publier sur la page « Releases »
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete exe --yes --cleanup-tag || true
          VERSION="$(tr -d '\r\n' < pc/VERSION)"
          gh release create exe pc/dist/PlanningPDF.exe pc/dist/PlanningPDF-mail.exe version.json \
            --title "Planning PDF (Windows) — version ${VERSION} (fabrication ${{ github.run_number }})" \
            --notes "Deux versions, à choisir : PlanningPDF.exe (manuelle : bulletins déposés dans le dossier commande ou ajoutés à la main) ; PlanningPDF-mail.exe (en plus, récupère les commandes dans la boîte mail). Placez l'exe dans votre dossier PlanningPDF (à côté de codes.txt et du dossier commande)." \
            --latest=false

  # ---------------------------------------------------------------- dépôt public des mises à jour
  # Une release par version (« v2.8.0-28 », marquée « latest ») : les 4 fichiers + maj.json (numéro, nom, nouveautés,
  # empreintes SHA-256). L'appli et l'exe lisent https://github.com/<dépôt>/releases/latest/download/maj.json.
  publier:
    needs: [apk, exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Jeton du dépôt des mises à jour
        env:
          MAJ_TOKEN: ${{ secrets.MAJ_TOKEN }}
        run: |
          if [ -z "$MAJ_TOKEN" ]; then
            echo "::notice::Secret MAJ_TOKEN absent : rien n'est publié dans le dépôt des mises à jour (les releases « apk » et « exe » de ce dépôt suffisent)."
            echo "PUBLIER=non" >> "$GITHUB_ENV"
          else
            echo "PUBLIER=oui" >> "$GITHUB_ENV"
            echo "DEPOT_MAJ=${{ github.repository_owner }}/${NOM_DEPOT_MAJ}" >> "$GITHUB_ENV"
          fi

      - uses: actions/download-artifact@v4
        if: env.PUBLIER == 'oui'
        with:
          path: fichiers
          merge-multiple: true

      - name: Fiche maj.json et nouveautés
        if: env.PUBLIER == 'oui'
        run: |
          VERSION="$(tr -d '\r\n' < pc/VERSION)"
          TAG="v${VERSION}-${{ github.run_number }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md || true
          ls -l fichiers
          python3 - "$VERSION" "$TAG" "${{ github.run_number }}" <<'PY'
          import hashlib, json, os, sys, datetime
          version, tag, n = sys.argv[1], sys.argv[2], int(sys.argv[3])
          fichiers = {}
          for nom in ("PlanningCommandes.apk", "PlanningCommandes-mail.apk", "PlanningCommandes-lecture.apk", "PlanningPDF.exe", "PlanningPDF-mail.exe"):
              chemin = os.path.join("fichiers", nom)
              donnees = open(chemin, "rb").read()
              fichiers[nom] = {"sha256": hashlib.sha256(donnees).hexdigest(), "taille": len(donnees)}
          fiche = {"version": n, "nom": version, "tag": tag, "date": datetime.date.today().isoformat(),
                   "notes": open("notes.md", encoding="utf-8").read().strip(), "fichiers": fichiers}
          json.dump(fiche, open("fichiers/maj.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(json.dumps({k: v for k, v in fiche.items() if k != "notes"}, ensure_ascii=False, indent=1))
          PY

      - name: Publier dans le dépôt des mises à jour
        if: env.PUBLIER == 'oui'
        env:
          GH_TOKEN: ${{ secrets.MAJ_TOKEN }}
        run: |
          printf '\n---\n**Téléphone** : PlanningCommandes.apk (manuelle) ou PlanningCommandes-mail.apk (commandes par mail) ; PlanningCommandes-lecture.apk pour un proche qui consulte le planning partagé. **Windows** : PlanningPDF.exe (manuelle) ou PlanningPDF-mail.exe. Les applications installées se mettent à jour toutes seules (Réglages › Mise à jour ; sur PC, au démarrage).\n' >> notes.md
          gh release create "$TAG" fichiers/PlanningCommandes.apk fichiers/PlanningCommandes-mail.apk fichiers/PlanningCommandes-lecture.apk \
            fichiers/PlanningPDF.exe fichiers/PlanningPDF-mail.exe fichiers/maj.json \
            --repo "$DEPOT_MAJ" --title "Version ${VERSION}" --notes-file notes.md --latest
          # page d'accueil du dépôt : liens directs vers la dernière version
          {
            echo "# Planning Commandes — mises à jour"
            echo
            echo "Dernière version : **${VERSION}** ($(date +%d/%m/%Y))."
            echo
            echo "| | Version manuelle | Version « mail » (commandes relevées dans la boîte mail) |"
            echo "|---|---|---|"
            echo "| **Téléphone Android** | [PlanningCommandes.apk](https://github.com/${DEPOT_MAJ}/releases/latest/download/PlanningCommandes.apk) | [PlanningCommandes-mail.apk](https://github.com/${DEPOT_MAJ}/releases/latest/download/PlanningCommandes-mail.apk) |"
            echo "| **PC Windows** | [PlanningPDF.exe](https://github.com/${DEPOT_MAJ}/releases/latest/download/PlanningPDF.exe) | [PlanningPDF-mail.exe](https://github.com/${DEPOT_MAJ}/releases/latest/download/PlanningPDF-mail.exe) |"
            echo
            echo "**Pour un proche** (conjoint…) qui veut seulement voir votre planning à jour : [PlanningCommandes-lecture.apk](https://github.com/${DEPOT_MAJ}/releases/latest/download/PlanningCommandes-lecture.apk) — à régler avec le kDrive et le code de partage (Réglages › Partage du planning sur votre téléphone)."
            echo
            echo "**PC** : placez l'exe dans votre dossier PlanningPDF habituel (celui qui contient \`codes.txt\` et le dossier \`commande\`), à la place de l'ancien — pas dans Téléchargements."
            echo
            echo "Une fois installées, l'application et le programme PC se mettent à jour d'eux-mêmes à partir d'ici."
            echo "Toutes les versions : [Releases](https://github.com/${DEPOT_MAJ}/releases)."
            echo
            echo "## Nouveautés de la version ${VERSION}"
            echo
            awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md
          } > LISEZ.md
          SHA="$(gh api "repos/${DEPOT_MAJ}/contents/README.md" --jq .sha 2>/dev/null || true)"
          gh api -X PUT "repos/${DEPOT_MAJ}/contents/README.md" -f message="Version ${VERSION}" \
            -f content="$(base64 -w0 LISEZ.md)" ${SHA:+-f sha="$SHA"} > /dev/null
          echo "Publié : https://github.com/${DEPOT_MAJ}/releases/tag/${TAG}"
